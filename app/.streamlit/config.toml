[theme]
base            = "dark"
primaryColor    = "#6C63FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D2E"
textColor       = "#E8EAF6"
font            = "sans serif"

[server]
headless        = true
# enableCORS is left at Streamlit's default (true). Setting it to false makes Streamlit send
# Access-Control-Allow-Origin: * and accept WebSocket connections from any origin, so any site
# could drive the app (and spend the OpenAI key). For extra origins use server.corsAllowedOrigins.

[browser]
gatherUsageStats = false
